<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="SaveGram Logo">
  <defs>
    <radialGradient id="ig-base" gradientUnits="userSpaceOnUse" cx="28" cy="134" r="154">
      <stop offset="0%" stop-color="#FFDD55"/>
      <stop offset="16%" stop-color="#FF9A1F"/>
      <stop offset="42%" stop-color="#FF1E6E"/>
      <stop offset="72%" stop-color="#C828C8"/>
      <stop offset="100%" stop-color="#5B42F3"/>
    </radialGradient>
    <radialGradient id="ig-top-indigo" gradientUnits="userSpaceOnUse" cx="12" cy="8" r="92">
      <stop offset="0%" stop-color="#405DE6" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#5851DB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#833AB4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Instagram-style rounded squircle -->
  <rect width="128" height="128" rx="28" fill="url(#ig-base)"/>
  <rect width="128" height="128" rx="28" fill="url(#ig-top-indigo)"/>

  <!-- Camera frame -->
  <rect x="20" y="20" width="88" height="88" rx="24" fill="none" stroke="#ffffff" stroke-width="8.5"/>

  <!-- Viewfinder / flash dot -->
  <circle cx="87.5" cy="40.5" r="5.2" fill="#ffffff"/>

  <!-- Download arrow + save tray -->
  <g fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="64" y1="42" x2="64" y2="72"/>
    <polyline points="48,59 64,75 80,59"/>
    <path d="M45 86 H83"/>
  </g>
</svg>
